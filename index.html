<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types sw">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research English Drill</title>
<meta name="description" content="瞬間英作文から研究ディスカッション・国際学会・博士公聴会まで、毎日続ける英語トレーニング">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">En</div>
  <h1>Research English Drill</h1>
  <button id="theme" aria-label="テーマ切替"></button>
</header>
<main>
  <section id="home">
    <div class="card hero">
      <div class="ring" id="ring"><div><b id="today">0</b><span id="goal-of"></span></div></div>
      <div>
        <p class="greet" id="greet"></p>
        <p class="streak">🔥<b id="streak">0</b>日連続</p>
        <p class="goal-label" id="goal-label"></p>
      </div>
    </div>
    <p id="flash"></p>

    <h2>レベルを選ぶ</h2>
    <div class="levels" id="levels"></div>

    <div class="start-wrap"><button id="start" class="primary">▶ スタート（10問ずつ）</button></div>

    <h2>学習の記録</h2>
    <div class="card">
      <div class="cal-head"><b>過去12週間</b><span class="muted">濃いほどたくさん回答</span></div>
      <div id="heatmap" aria-label="過去12週間の学習記録"></div>
    </div>

    <details class="card panel">
      <summary>⚙️ 設定</summary>
      <div class="row"><span>1日の目標回答数</span><input id="goal" type="number" min="5" max="200" step="5"></div>
      <div class="row"><span>1問の制限時間</span><select id="limit">
        <option value="0">なし</option><option value="5">5秒</option><option value="10">10秒</option><option value="15">15秒</option>
        <option value="20">20秒</option><option value="30">30秒</option><option value="auto">文の長さに応じて</option>
      </select></div>
      <div class="row" id="voice-row"><span>読み上げの声</span><select id="voice"></select></div>
    </details>
    <details class="card panel">
      <summary>📚 参考サイト</summary>
      <ul id="refs"></ul>
      <p class="muted">問題はすべて本サイトのオリジナルです。各サイトは分野・文法項目の構成の参考にしています。</p>
    </details>
  </section>

  <section id="study" hidden>
    <div class="bar">
      <button id="quit" class="icon-btn" aria-label="終了">✕</button>
      <div class="dots" id="dots"></div>
      <span class="pill" id="count"></span>
    </div>
    <div class="timer" id="timer-track"><i id="timer"></i></div>
    <div class="card" id="qcard">
      <p class="tag" id="track"></p>
      <p class="prompt" id="ja"></p>
      <textarea id="input" placeholder="英語で言ってみよう（入力・音声は任意）" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="actions">
        <button id="mic" hidden aria-label="音声入力">🎤</button>
        <button id="reveal" class="primary">答えを見る <kbd>Enter</kbd></button>
      </div>
      <div class="answer" id="answer" hidden>
        <p class="timeout" id="timeout" hidden>⏱ 時間切れ</p>
        <div class="row"><p class="en" id="en"></p><button id="speak" class="icon-btn" aria-label="読み上げ">🔊</button></div>
        <p class="note" id="note"></p>
        <p class="muted refs" id="card-refs"></p>
        <div class="judge">
          <button id="ng" class="ng">✕ 言えなかった<kbd>1</kbd></button>
          <button id="ok" class="ok">○ 言えた<kbd>2</kbd></button>
        </div>
      </div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="card result-hero">
      <div class="emoji" id="result-emoji"></div>
      <div class="ring" id="result-ring"><div><b id="result-score"></b><span>正解</span></div></div>
      <h2 id="result-title"></h2>
      <p class="muted" id="result-sub"></p>
    </div>
    <h2 id="miss-head">もう一度チャレンジする問題</h2>
    <ul class="result-list" id="result-list"></ul>
    <button id="next-round" class="primary"></button>
    <button id="home-btn" class="wide">ホームに戻る</button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
